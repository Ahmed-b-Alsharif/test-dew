<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Dew Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261115-order-success-1">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./" style="text-decoration:none">Dew<span>.</span></a>
  <a class="cart-btn" href="./" style="text-decoration:none">Continue shopping</a>
</div></header>

<div class="page" id="page">
  <form class="box" id="form">
    <h2>Delivery details</h2>
    <label for="name">Full name</label>
    <input id="name" required autocomplete="name" placeholder="Your first and last name">
    <label for="phone">Egyptian mobile number</label>
    <input id="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">
    <label for="deliveryArea">Governorate / delivery area</label>
    <select id="deliveryArea" name="area" required><option value="">Choose your delivery area</option></select>
    <label for="city">City / area</label>
    <input id="city" required autocomplete="address-level2" placeholder="City or neighborhood">
    <label for="street">Street address</label>
    <input id="street" required autocomplete="street-address" placeholder="Street name and number">
    <label for="building">Building / floor / apartment (optional)</label>
    <input id="building" autocomplete="address-line2" placeholder="Building, floor, apartment">
    <label for="customerNote">Order note (optional)</label>
    <textarea id="customerNote" rows="3" maxlength="500" placeholder="Delivery instructions or other notes"></textarea>
    <small class="note">Your note will be included with your order for our team.</small>
    <section class="payment-methods"><h3>Payment method</h3><label class="opt"><input type="radio" name="paymentMethod" value="cod" checked> <span>Cash on Delivery (COD)</span></label><label class="opt"><input type="radio" name="paymentMethod" value="instapay"> <span>InstaPay</span></label><div id="paymentDetails" class="payment-details" hidden></div></section>
    <div class="err" id="err"></div>
    <button class="btn red" id="submit" style="width:100%;margin-top:8px">Complete order</button>
  </form>

  <div class="box" id="summary"><h2>Order summary</h2><div id="sumBody"></div></div>
</div>

<script src="cart.js"></script>
<script src="checkout.js?v=20261115-egypt-checkout-1"></script>
<script src="storefront-ui.js?v=20261111-checkout-search-removed-1"></script>
</body>
</html>
