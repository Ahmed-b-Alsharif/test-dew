<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Dew Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./" style="text-decoration:none">Dew<span>.</span></a>
  <a class="cart-btn" href="./" style="text-decoration:none">Continue shopping</a>
</div></header>

<div class="page" id="page">
  <form class="box" id="form">
    <h2>Delivery details</h2>
    <div class="row2">
      <div><label>First name</label><input id="first" required autocomplete="given-name"></div>
      <div><label>Last name</label><input id="last" required autocomplete="family-name"></div>
    </div>
    <label>Full address</label><textarea id="address" rows="3" required placeholder="Street, building, floor, apartment, area"></textarea>
    <div><label>Phone</label><input id="phone" required inputmode="tel" autocomplete="tel"></div>
    <label for="customerNote">Order note (optional)</label>
    <textarea id="customerNote" rows="3" maxlength="500" placeholder="Add a note for Dew Skincare (delivery instructions, preferences, etc.)"></textarea>
    <small class="note">This note will be included with your order for our team.</small>
    <label>Delivery area</label>
    <select id="deliveryArea" name="area" required><option value="">Choose your governorate</option></select>
    <section class="payment-methods"><h3>Payment method</h3><label class="opt"><input type="radio" name="paymentMethod" value="cod" checked> <span>Cash on Delivery (COD)</span></label><label class="opt"><input type="radio" name="paymentMethod" value="instapay"> <span>InstaPay</span></label><div id="paymentDetails" class="payment-details" hidden></div></section><div class="err" id="err"></div>
    <button class="btn red" id="submit" style="width:100%;margin-top:8px">Complete order</button>
    
  </form>

  <div class="box" id="summary"><h2>Order summary</h2><div id="sumBody"></div></div>
</div>

<script src="cart.js"></script>
<script src="checkout.js"></script>
<script src="storefront-ui.js?v=20261110-4"></script>
</body>
</html>
