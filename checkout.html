<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Dew Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261116-receipt-logo-1">
<link rel="icon" type="image/png" href="/test-dew/favicon.png?v=20261117-1"></head>
<body class="dew-checkout-page">
<header class="top"><div class="wrap">
  <a class="brand" href="./" style="text-decoration:none"><img class="dew-logo-image" src="dew-logo.svg" alt="Dew Skincare Egypt" width="569" height="207"></a>
  <a class="cart-btn" href="./" style="text-decoration:none">Continue shopping</a>
</div></header>

<main class="page" id="page">
  <form class="checkout-form" id="form">
    <section class="checkout-card">
      <div class="checkout-section-title"><span>1</span><h2>Your details</h2></div>
      <div class="checkout-field-grid">
        <div><label for="firstName">First name</label><input id="firstName" required autocomplete="given-name" placeholder="First name"></div>
        <div><label for="lastName">Last name</label><input id="lastName" required autocomplete="family-name" placeholder="Last name"></div>
        <div class="checkout-field-wide"><label for="phone">Egyptian mobile number</label><input id="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></div>
      </div>
    </section>
    <section class="checkout-card">
      <div class="checkout-section-title"><span>2</span><h2>Delivery address</h2></div>
      <div class="checkout-field-grid">
        <div><label for="deliveryArea">Governorate / delivery area</label><select id="deliveryArea" name="area" required><option value="">Choose your delivery area</option></select></div>
        <div><label for="city">City / area</label><input id="city" required autocomplete="address-level2" placeholder="City or neighborhood"></div>
        <div><label for="street">Street address</label><input id="street" required autocomplete="street-address" placeholder="Street name and number"></div>
        <div><label for="building">Building / floor / apartment (optional)</label><input id="building" autocomplete="address-line2" placeholder="Building, floor, apartment"></div>
        <div class="checkout-field-wide"><label for="customerNote">Order note (optional)</label><textarea id="customerNote" rows="3" maxlength="500" placeholder="Delivery instructions or other notes"></textarea><small class="note">Your note will be included with your order for our team.</small></div>
      </div>
    </section>
    <section class="checkout-card">
      <div class="checkout-section-title"><span>3</span><h2>Payment</h2></div>
      <div class="payment-methods">
        <label class="opt"><input type="radio" name="paymentMethod" value="cod" checked> <span>Cash on Delivery (COD)</span></label>
        <label class="opt"><input type="radio" name="paymentMethod" value="instapay"> <span>InstaPay</span></label>
        <div id="paymentDetails" class="payment-details" hidden></div>
      </div>
    </section>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button class="btn red checkout-submit" id="submit" type="submit">Complete order</button>
  </form>
  <aside class="box checkout-summary" id="summary">
    <h2>Order summary</h2>
    <div id="sumBody"></div>
  </aside>
</main>
<script src="cart.js"></script>
<script src="checkout.js?v=20261117-stock-1"></script>
<script src="storefront-ui.js?v=20261118-global-announcement-1"></script>
</body>
</html>
