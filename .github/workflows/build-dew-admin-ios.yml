name: Build Dew Admin iPhone IPA
# Rebuild after native Orders screen update and refresh fix
# Rebuild after fixing the storefront links in the iPhone admin app.
# Rebuild after mobile full-width layout, safe-area and device-responsive sizing improvements
# Rebuild with a native-only, readable Theme structure layout.

on:
  push:
    branches:
      - ios-app-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out build workflow
        uses: actions/checkout@v4

      - name: Check out Dew website source
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Capacitor app
        shell: bash
        run: |
          mkdir -p dew-iphone-app/www
          cp site/admin.html dew-iphone-app/www/index.html
          cp site/admin.js dew-iphone-app/www/admin.js
          cp site/styles.css dew-iphone-app/www/styles.css
          cp site/cart.js dew-iphone-app/www/cart.js

          # iPhone-only Theme editor layout improvements.
          # These rules are appended only to the generated app bundle; the live site and desktop admin are untouched.
          cat >> dew-iphone-app/www/styles.css <<'CSS'
          /* Dew iPhone app: readable Theme structure and editor spacing */
          .dew-native-app .homepage-theme-editor {
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch !important;
            gap: 18px !important;
            width: 100% !important;
          }
          .dew-native-app .homepage-section-list {
            position: static !important;
            width: 100% !important;
            overflow: visible !important;
            border-radius: 14px !important;
          }
          .dew-native-app .homepage-section-list-head {
            padding: 17px 16px !important;
          }
          .dew-native-app .homepage-section-list-head b {
            font-size: 15px !important;
            line-height: 1.4 !important;
          }
          .dew-native-app .homepage-section-list-head small {
            font-size: 12px !important;
            line-height: 1.55 !important;
            margin-top: 5px !important;
          }
          .dew-native-app .homepage-section-list #homepageSectionNav {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 0 !important;
            overflow: visible !important;
          }
          .dew-native-app .hp-section-nav {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) auto !important;
            gap: 5px 10px !important;
            align-items: center !important;
            width: 100% !important;
            min-width: 0 !important;
            min-height: 68px !important;
            padding: 13px 15px !important;
            border-right: 0 !important;
            border-bottom: 1px solid #edf1ec !important;
            text-align: left !important;
            white-space: normal !important;
          }
          .dew-native-app .hp-section-nav:last-child {
            border-bottom: 0 !important;
          }
          .dew-native-app .hp-section-nav b {
            font-size: 14px !important;
            line-height: 1.35 !important;
          }
          .dew-native-app .hp-section-nav small {
            grid-column: 1 !important;
            font-size: 11px !important;
            line-height: 1.45 !important;
            white-space: normal !important;
          }
          .dew-native-app .hp-section-nav span {
            grid-column: 2 !important;
            grid-row: 1 / 3 !important;
            font-size: 10px !important;
            padding: 6px 9px !important;
          }
          .dew-native-app .homepage-editor-work {
            gap: 18px !important;
            width: 100% !important;
          }
          .dew-native-app .homepage-editor-card,
          .dew-native-app .homepage-preview-card {
            border-radius: 14px !important;
          }
          .dew-native-app .homepage-editor-card {
            padding: 17px !important;
          }
          .dew-native-app .homepage-editor-title {
            align-items: flex-start !important;
            flex-direction: column !important;
            gap: 10px !important;
            padding-bottom: 16px !important;
          }
          .dew-native-app .homepage-editor-title h3 {
            font-size: 23px !important;
            line-height: 1.3 !important;
          }
          .dew-native-app .homepage-editor-title p {
            font-size: 12px !important;
            line-height: 1.55 !important;
          }
          .dew-native-app .homepage-editor-fields {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 15px !important;
            padding: 17px 0 5px !important;
          }
          .dew-native-app .homepage-editor-fields > .editor-field,
          .dew-native-app .homepage-editor-fields > .editor-subgroup {
            grid-column: 1 !important;
            min-width: 0 !important;
            margin-bottom: 0 !important;
          }
          .dew-native-app .editor-subgroup {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 13px !important;
            padding: 15px !important;
            margin: 0 !important;
            border-radius: 12px !important;
          }
          .dew-native-app .editor-subgroup > b {
            grid-column: 1 !important;
            font-size: 13px !important;
            line-height: 1.4 !important;
            margin-bottom: 2px !important;
          }
          .dew-native-app .editor-field {
            min-width: 0 !important;
            margin: 0 !important;
          }
          .dew-native-app .editor-field > label {
            display: block !important;
            margin: 0 0 7px !important;
            font-size: 12px !important;
            line-height: 1.45 !important;
          }
          .dew-native-app .editor-field input:not([type="checkbox"]):not([type="file"]),
          .dew-native-app .editor-field select,
          .dew-native-app .editor-field textarea {
            box-sizing: border-box !important;
            width: 100% !important;
            min-height: 45px !important;
            padding: 11px 12px !important;
            border-radius: 9px !important;
            font-size: 14px !important;
          }
          .dew-native-app .editor-field textarea {
            min-height: 94px !important;
            line-height: 1.5 !important;
          }
          .dew-native-app .homepage-upload-preview {
            align-items: flex-start !important;
            gap: 10px !important;
          }
          .dew-native-app .homepage-upload-preview img,
          .dew-native-app .homepage-upload-preview > span {
            width: 108px !important;
            height: 78px !important;
            flex: 0 0 108px !important;
          }
          .dew-native-app .homepage-preview-top {
            align-items: flex-start !important;
            flex-direction: column !important;
            gap: 5px !important;
            padding: 14px 16px !important;
          }
          .dew-native-app .homepage-preview-top b {
            font-size: 13px !important;
          }
          .dew-native-app .homepage-preview-top span {
            font-size: 11px !important;
            line-height: 1.45 !important;
          }
          .dew-native-app .hp-intro {
            gap: 12px !important;
          }
          .dew-native-app .hp-theme-save-area {
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch !important;
            gap: 9px !important;
            width: 100% !important;
          }
          .dew-native-app #saveAllTheme,
          .dew-native-app .hp-theme-save-area .admin-view-store {
            box-sizing: border-box !important;
            width: 100% !important;
            min-height: 45px !important;
            justify-content: center !important;
            text-align: center !important;
          }
          @media (max-width: 420px) {
            .dew-native-app .homepage-editor-card { padding: 14px !important; }
            .dew-native-app .hp-section-nav { min-height: 72px !important; padding: 13px !important; }
            .dew-native-app .hp-section-nav b { font-size: 13px !important; }
            .dew-native-app .homepage-editor-title h3 { font-size: 21px !important; }
          }
          CSS

          cd dew-iphone-app
          npm init -y
          npm install --save-exact @capacitor/core@8.6.0 @capacitor/ios@8.6.0
          npm install --save-dev --save-exact @capacitor/cli@8.6.0
          npx cap init "Dew Admin" "com.dewskincare.admin" --web-dir=www
          npx cap add ios
          npx cap sync ios
          npm install --no-save sharp
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp ../ios-assets/Contents.json ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const target = 'ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png';
            const png = await sharp('../ios-assets/dew-app-icon.svg').resize(1024,1024).png().toBuffer();
            const image = await sharp(png).raw().toBuffer({ resolveWithObject: true });
            const { data, info } = image;
            const corner = [...data.slice(0, info.channels)];
            if (info.width !== 1024 || info.height !== 1024 || corner[0] > 100 || corner[1] > 130 || corner[2] > 110) {
              throw new Error('Dew app icon did not render correctly; corner pixel=' + corner.join(','));
            }
            require('fs').writeFileSync(target, png);
            console.log('Verified Dew icon:', info.width + 'x' + info.height, 'corner RGB', corner.join(','), 'bytes', png.length);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Build unsigned iOS app
        shell: bash
        run: |
          cd dew-iphone-app
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/App.app
          cd build
          /usr/bin/zip -qry DewAdmin-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DewAdmin-unsigned-IPA
          path: dew-iphone-app/build/DewAdmin-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

# Latest main admin features are bundled at build time; the Theme layout overrides above are app-only.
