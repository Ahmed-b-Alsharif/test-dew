name: Migrate Shopify-hosted product images

on:
  push:
    branches: [main]
    paths:
      - "scripts/convert-existing-images.mjs"
      - ".github/workflows/convert-existing-images.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dew-shopify-image-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Shopify images without changing them
        run: node scripts/convert-existing-images.mjs

      - name: Open migration pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/migrate-shopify-images-to-dew
          delete-branch: true
          commit-message: "Migrate Shopify-hosted images to Dew assets"
          title: "Migrate Shopify-hosted images to Dew assets"
          body: |
            This automated migration downloads every Shopify CDN image referenced by the site into the repository and updates the matching references.

            - Original image bytes are preserved exactly.
            - No resizing, recompression, or format conversion is performed.
            - Duplicate image content is stored only once.
            - All text/data files containing image references are included in this pull request.
            - The script verifies that no Shopify CDN image references remain before completing.
